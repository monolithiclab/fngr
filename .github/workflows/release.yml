name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

# Nothing at workflow scope: a token minted here is handed to every step of
# every job, third-party actions included. The one job that needs write
# scopes asks for them itself, below.
permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # GitHub Release create/upload
      packages: write       # ghcr.io push
      id-token: write       # cosign keyless via OIDC
    steps:
      # gomddoc's v0.1.0 failed *after* a 4-minute build: the tap token could
      # authenticate but lacked Contents:write on monolithiclab/homebrew-tap, so
      # GoReleaser 403'd on the very last step, leaving a published GitHub Release
      # with no Homebrew formula. fngr shares the tap and the failure mode; check
      # the token up front so a misconfiguration costs seconds, not a re-tag.
      # Prerelease tags are only warned about, matching `skip_upload: auto` in
      # .goreleaser.yaml (which skips the brew step for prereleases anyway).
      - name: Preflight - verify Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: monolithiclab/homebrew-tap
        run: |
          set -uo pipefail
          case "${GITHUB_REF_NAME}" in
            *-*) severity=warning ;;   # prerelease: brew upload is skipped
            *)   severity=error   ;;
          esac
          fail() {
            echo "::${severity}::$1"
            [ "$severity" = error ] && exit 1 || exit 0
          }

          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            fail "HOMEBREW_TAP_TOKEN is not set. Add a fine-grained PAT with 'Contents: Read and write' on ${TAP} to this repository's Actions secrets."
          fi

          response=$(curl -sS -o /tmp/tap.json -w '%{http_code}' \
            -H "Authorization: Bearer ${HOMEBREW_TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${TAP}") || fail "Could not reach the GitHub API to validate HOMEBREW_TAP_TOKEN."

          case "$response" in
            200) ;;
            401) fail "HOMEBREW_TAP_TOKEN is invalid or expired (401). Mint a new fine-grained PAT with 'Contents: Read and write' on ${TAP}." ;;
            404) fail "HOMEBREW_TAP_TOKEN cannot see ${TAP} (404). A fine-grained PAT must list ${TAP} under 'Repository access'." ;;
            *)   fail "Unexpected HTTP ${response} validating HOMEBREW_TAP_TOKEN against ${TAP}." ;;
          esac

          if [ "$(jq -r '.permissions.push // false' /tmp/tap.json)" != "true" ]; then
            fail "HOMEBREW_TAP_TOKEN can read ${TAP} but cannot push to it. Grant 'Contents: Read and write' - read-only is what made gomddoc's v0.1.0 release 403."
          fi
          echo "HOMEBREW_TAP_TOKEN verified: push access to ${TAP} confirmed."

      # Every action is pinned to a commit SHA, not a tag. A tag is a
      # mutable pointer, and this job holds a token that can publish a
      # release, push to ghcr.io and sign with our OIDC identity — whoever
      # can move a tag inherits all three. The trailing comment names the
      # version each SHA is; docs/publishing.md has the refresh recipe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # GoReleaser needs full history for changelog
          # Don't leave the token in .git/config for the rest of the job:
          # the release runs `before` hooks and a third-party release
          # binary against this checkout. Nothing here needs it — the
          # GitHub Release and the Homebrew tap are both API calls with
          # their own tokens, and the changelog reads local history.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Both of these default to a *mutable* image tag — binfmt:latest, which
      # runs privileged on the runner, and buildkit:buildx-stable-1, which
      # builds every layer we push. Pinning the action alone leaves the hole
      # one level down, inside the job holding all three write scopes.
      # Digests read from the registry on 2026-10-07.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Installs cosign v3, whose sign-blob requires --bundle; .goreleaser.yaml's
      # signs: block writes SHA256SUMS.sigstore.json accordingly.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # syft writes the per-archive SBOMs configured in .goreleaser.yaml.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # An exact version, not `latest`: what builds and signs a release
          # should not change between two tags without a commit saying so.
          version: v2.18.2
          args: release --clean
        env:
          # GoReleaser otherwise picks the tag from `git tag --points-at HEAD`,
          # and git's version sort ranks v1.2.3-rc1 above v1.2.3: with both on
          # one commit (gomddoc, 2026-09-25) the final tag re-released the rc.
          # Pin it to the tag that triggered this run.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
