name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

# Nothing at workflow scope: a token minted here is handed to every step of
# every job, third-party actions included. The one job that needs write
# scopes asks for them itself, below.
permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # GitHub Release create/upload
      packages: write       # ghcr.io push
      id-token: write       # cosign keyless via OIDC
    steps:
      # Every action is pinned to a commit SHA, not a tag. A tag is a
      # mutable pointer, and this job holds a token that can publish a
      # release, push to ghcr.io and sign with our OIDC identity — whoever
      # can move a tag inherits all three. The trailing comment names the
      # version each SHA is; docs/PUBLISHING.md has the refresh recipe.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # GoReleaser needs full history for changelog
          # Don't leave the token in .git/config for the rest of the job:
          # the release runs `before` hooks and a third-party release
          # binary against this checkout. Nothing here needs it — the
          # GitHub Release and the Homebrew tap are both API calls with
          # their own tokens, and the changelog reads local history.
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # Both of these default to a *mutable* image tag — binfmt:latest, which
      # runs privileged on the runner, and buildkit:buildx-stable-1, which
      # builds every layer we push. Pinning the action alone leaves the hole
      # one level down, inside the job holding all three write scopes.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Installer major and cosign major are not the same number: the v3 line
      # of this action installs cosign v2.x, which still writes the detached
      # .sig + .pem our .goreleaser.yaml `signs` args ask for. The v4 line
      # installs cosign v3.x, which emits a single .sigstore.json bundle and
      # deprecates --output-signature/--output-certificate. Stay here until
      # those args move to the bundle shape.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      # syft writes the per-archive SBOMs configured in .goreleaser.yaml.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # An exact version, not `latest`: what builds and signs a release
          # should not change between two tags without a commit saying so.
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
