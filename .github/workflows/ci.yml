name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only, workflow-wide: nothing here publishes anything, and a job added
# later inherits the floor rather than having to remember it. release.yml
# takes the other shape — deny-by-default, one job granting itself writes —
# because there it is a real distinction.
permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs for the reason release.yml gives;
      # docs/publishing.md has the refresh recipe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # go.mod's toolchain line is the Go every developer runs (go.mk exports
      # it as GOTOOLCHAIN); the lint tools are pinned in tools/go.mod, so its
      # go.sum is part of the cache key too.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go version
      # The whole gate, exactly as run locally: lint (including govulncheck
      # and the pin check) and the tests.
      - run: make ci
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: cover.out
          if-no-files-found: error
          retention-days: 14
