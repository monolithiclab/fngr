# staticcheck's default is "all" minus seven ST checks. This file puts ST1000 (package comments) back, as the lab's
# go-cli-development standard requires: every package says what it is for. The other six stay off: ST1003 and
# ST1016 are naming churn, ST1020-ST1022 force a "Foo does..." form on every exported comment, and ST1023 duplicates
# what `make lint-fix` applies.
checks = ["all", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023"]
